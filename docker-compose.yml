version: '3.8'

# ============================================
# Production Docker Compose Configuration
# All services with custom Dockerfiles
# Optimized for reliability, security, and performance
# ============================================

networks:
  comicwise-network:
    driver: bridge
    name: comicwise_network
    driver_opts:
      com.docker.network.bridge.name: br-comicwise
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  postgres_data:
    driver: local
    name: comicwise_postgres_data
    driver_opts:
      type: local
  redis_data:
    driver: local
    name: comicwise_redis_data
    driver_opts:
      type: local
  pgadmin_data:
    driver: local
    name: comicwise_pgadmin_data
    driver_opts:
      type: local

services:
  # ============================================
  # PostgreSQL - Production
  # ============================================
  postgres:
    build:
      context: .
      dockerfile: compose/production/postgres/Dockerfile
      target: latest
    image: comicwise-postgres:prod
    container_name: comicwise-db
    restart: on-failure:5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comicwise}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount production initialization scripts
      - ./compose/production/postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      comicwise-network:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-comicwise}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 256mb
    # Production: optimized resources
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=postgres,env=production"

  # ============================================
  # Redis - Production
  # ============================================
  redis:
    build:
      context: .
      dockerfile: compose/production/redis/Dockerfile
      target: latest
    image: comicwise-redis:prod
    container_name: comicwise-redis
    restart: on-failure:5
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      comicwise-network:
        ipv4_address: 172.28.0.3
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    # Production: optimized resources
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=redis,env=production"

  # ============================================
  # PgAdmin - Production
  # ============================================
  pgadmin:
    build:
      context: .
      dockerfile: compose/production/pgadmin/Dockerfile.pgadmin
      target: latest
    image: comicwise-pgadmin:prod
    container_name: comicwise-pgadmin
    restart: on-failure:3
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: 1
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_COOKIE_DEFAULT_SECURE: "True"
      PGADMIN_CONFIG_COOKIE_SAMESITE: "Strict"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      comicwise-network:
        ipv4_address: 172.28.0.4
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Production: optimized resources
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=pgadmin,env=production"

  # ============================================
  # Next.js Application - Production
  # ============================================
  app:
    build:
      context: .
      dockerfile: compose/production/node/Dockerfile
      args:
        - NODE_ENV=production
        - BUILDKIT_INLINE_CACHE=1
      cache_from:
        - type=registry,ref=comicwise-app:buildcache
    image: comicwise-app:latest
    container_name: comicwise-app
    restart: on-failure:3
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-comicwise}?schema=public&connection_limit=20&pool_timeout=20&connect_timeout=10
      
      # Redis Configuration
      REDIS_URL: redis://redis:6379
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      
      # Authentication
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      
      # Email Configuration
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      
      # Application Settings
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      
      # Performance Tuning
      NODE_OPTIONS: "--max-old-space-size=2048 --enable-source-maps=false"
      NEXT_TELEMETRY_DISABLED: "1"
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    networks:
      comicwise-network:
        ipv4_address: 172.28.0.5
    
    # Production: strict health check
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    
    # Production: resource limits and restart policy
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=app,env=production"
